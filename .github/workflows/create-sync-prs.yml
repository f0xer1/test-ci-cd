name: Auto-create chain PRs

on:
  push:
    branches: [master, pre]

jobs:
  create-prs:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Create downstream PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            master)
              targets=("master:pre:🔀 master → pre" "master:develop:⏪ master → develop (back-merge)")
              ;;
            pre)
              targets=("pre:prod:🚀 pre → prod")
              ;;
          esac

          for t in "${targets[@]}"; do
            IFS=":" read -r head base title <<< "$t"
            echo "→ Creating PR: $head → $base"
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$base" --head "$head" \
              --title "$title" \
              --body "Auto-created after $head update ($GITHUB_SHA)" \
              || echo "  Skipped (PR exists or no diff)"
          done